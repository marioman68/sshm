[package]
name = "sshm-desktop"
version = "4.0.0"
edition = "2021"
description = "sshm desktop app and tray monitor (Rust). Shares ~/.config/sshm with the Python terminal UI and CLI."
license = "MIT"

[[bin]]
name = "sshm-gui"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
ksni = { version = "0.3", features = ["blocking"] }
notify-rust = "4"
tiny-skia = "0.11"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
