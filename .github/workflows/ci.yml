name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the window and tray
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
